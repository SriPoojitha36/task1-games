<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sudoku Puzzle Generator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <section class="panel">
      <div>
        <p class="eyebrow">Puzzle Lab</p>
        <h1>Sudoku Generator</h1>
      </div>
      <div class="controls">
        <select id="difficulty" aria-label="Difficulty">
          <option value="easy">Easy</option>
          <option value="medium" selected>Medium</option>
          <option value="hard">Hard</option>
        </select>
        <button id="newPuzzle">New Puzzle</button>
        <button id="checkPuzzle">Check</button>
        <button id="solvePuzzle">Solve</button>
      </div>
    </section>

    <section class="board-wrap">
      <div id="board" class="board" aria-label="Sudoku board"></div>
      <p id="message" class="message">Fill the empty cells with numbers 1-9.</p>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
